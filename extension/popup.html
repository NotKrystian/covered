<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Covered reader</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #111;
        --muted: #6b7280;
        --line: #e5e7eb;
        --accent: #0f766e;
        --bg: #fff;
        --panel: #f7f7f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --line: #2a2f3a;
          --accent: #2dd4bf;
          --bg: #0f1115;
          --panel: #171a21;
        }
      }
      body {
        margin: 0;
        width: 300px;
        padding: 14px 16px 16px;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 4px;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--muted);
      }
      .dot.on {
        background: var(--accent);
      }
      .code-card {
        margin-top: 14px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
      }
      .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .code-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
      }
      #code {
        font: 600 26px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: var(--fg);
        padding: 6px 10px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hint {
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 10px;
        margin: 14px 0 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 14px;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <h1>Covered reader</h1>
    <div class="status"><span id="dot" class="dot"></span><span id="status">Checking…</span></div>

    <div class="code-card">
      <div class="label">Pair code</div>
      <div class="code-row">
        <span id="code">······</span>
        <button id="copy" type="button" disabled>Copy</button>
      </div>
      <div id="expires" class="hint">Enter this on your phone, or on covered.kawuc.uk/ext in another browser.</div>
    </div>

    <dl>
      <dt>Last job</dt>
      <dd id="last-job">—</dd>
      <dt>Result</dt>
      <dd id="last-result">—</dd>
      <dt>Last poll</dt>
      <dd id="last-poll">—</dd>
    </dl>

    <div class="actions">
      <button id="poll" type="button" class="primary">Poll now</button>
      <button id="new-code" type="button">New code</button>
    </div>
    <p class="hint">Checks for phone searches every minute; holds a 20-second long-poll while awake. <a id="ext-link" href="#">Setup</a></p>

    <script src="popup.js"></script>
  </body>
</html>
