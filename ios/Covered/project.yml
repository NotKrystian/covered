name: Covered
options:
  bundleIdPrefix: uk.kawuc
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug
settings:
  SWIFT_VERSION: "5.10"
  TARGETED_DEVICE_FAMILY: "1"
  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  SUPPORTS_MACCATALYST: NO
  SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
  ENABLE_TESTABILITY: YES
targets:
  Covered:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Covered/App
        excludes:
          - Info.plist
      - path: Covered/Core
      - path: Covered/Features
      - path: Covered/Assets.xcassets
      - path: Covered/Resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: uk.kawuc.covered
      PRODUCT_NAME: Covered
      INFOPLIST_FILE: Covered/App/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Covered
      INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_UIRequiresFullScreen: YES
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "5"
      CODE_SIGN_STYLE: Automatic
      SWIFT_VERSION: "5.10"
      TARGETED_DEVICE_FAMILY: "1"
      SUPPORTS_MACCATALYST: NO
    info:
      path: Covered/App/Info.plist
      properties:
        CFBundleDisplayName: Covered
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "5"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIAppFonts:
          - Fonts/Geist-Variable.ttf
        NSFaceIDUsageDescription: Confirm purchases from your Covered wallet.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
    scheme:
      testTargets:
        - CoveredTests
        - CoveredUITests
  CoveredTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoveredTests
    dependencies:
      - target: Covered
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: uk.kawuc.covered.tests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.10"
      TARGETED_DEVICE_FAMILY: "1"
  CoveredUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CoveredUITests
    dependencies:
      - target: Covered
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: uk.kawuc.covered.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: Covered
      SWIFT_VERSION: "5.10"
      TARGETED_DEVICE_FAMILY: "1"
schemes:
  Covered:
    build:
      targets:
        Covered: all
        CoveredTests: [test]
        CoveredUITests: [test]
    test:
      targets:
        - CoveredTests
        - CoveredUITests
